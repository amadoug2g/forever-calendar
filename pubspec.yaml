name: forever_calendar
description: Never forget important dates
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Palanquin_Dark/
    - assets/fonts/Rosario/

  fonts:
    - family: PalanquinDark
      fonts:
        - asset: assets/fonts/Palanquin_Dark/PalanquinDark-Regular.ttf
        - asset: assets/fonts/Palanquin_Dark/PalanquinDark-Medium.ttf
          weight: 500
        - asset: assets/fonts/Palanquin_Dark/PalanquinDark-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Palanquin_Dark/PalanquinDark-Bold.ttf
          weight: 700
    - family: Rosario
      fonts:
        - asset: assets/fonts/Rosario/static/Rosario-Regular.ttf
        - asset: assets/fonts/Rosario/static/Rosario-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rosario/static/Rosario-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rosario/static/Rosario-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rosario/static/Rosario-Italic.ttf
          style: italic
        - asset: assets/fonts/Rosario/static/Rosario-BoldItalic.ttf
          weight: 700
          style: italic
